<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Produk — Mini Shopee</title>
    <link rel="stylesheet" href="./css/style.css" />

  
    <script src="./js/session.js" defer></script>
    <script src="./js/format.js" defer></script>
    <script src="./js/products.js" defer></script>
    <script src="./js/cart.js" defer></script>
  </head>

  
  <body hidden>
    <header class="navbar">
      <div class="navbar-inner">
        <span class="navbar-brand">Mini Shopee</span>

        <div class="navbar-right">
          <span id="greeting" class="navbar-greeting"></span>

         
          <button type="button" id="cart-button" class="cart-button">
            Keranjang
            <span id="cart-badge" class="cart-badge">0</span>
          </button>
          <span id="cart-total" class="cart-total"></span>

          <button type="button" id="logout-button" class="logout-button">
            Logout
          </button>

          
          <div id="cart-panel" class="cart-panel" hidden>
            <h2 class="cart-panel-title">Keranjang</h2>
            <div id="cart-items" class="cart-items"></div>
            <button type="button" id="cart-clear" class="cart-clear" hidden>
              Kosongkan keranjang
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      
      <section class="toolbar">
        <input type="search" id="search-input" placeholder="Cari produk..." />
        <select id="category-filter">
          <option value="">Semua kategori</option>
        </select>
        <select id="sort-select">
          <option value="">Urutkan...</option>
          <option value="price-asc">Harga termurah</option>
          <option value="price-desc">Harga termahal</option>
          <option value="rating-desc">Rating tertinggi</option>
        </select>
      </section>

      
      <div id="products-error" class="error-box" role="alert" hidden></div>

      
      <section id="product-grid" class="product-grid"></section>

      <button type="button" id="load-more" class="load-more" hidden>
        Load More
      </button>
    </main>

    
    <div id="product-modal" class="modal" hidden>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </body>
</html>
