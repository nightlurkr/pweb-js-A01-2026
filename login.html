<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Shopee</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/auth.js" defer></script>
  </head>

  <body class="login-body">
    <main class="login-card">
      <header class="login-header">
        <h1 class="login-title">Mini Shopee</h1>
        <p class="login-subtitle">Masuk untuk melihat katalog produk</p>
      </header>

      <div id="error-box" class="error-box" role="alert" hidden></div>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="emilys"
            autocomplete="username"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" id="login-button" class="login-button">
          <span id="login-button-text">Masuk</span>
          <span id="login-spinner" class="spinner" hidden></span>
        </button>
      </form>

      <footer class="login-footer">
        <p>Data pengguna diambil dari <code>dummyjson.com/users</code></p>
      </footer>
    </main>
  </body>
</html>
